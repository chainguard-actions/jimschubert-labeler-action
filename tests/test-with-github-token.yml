name: Test with GITHUB_TOKEN input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with explicit GITHUB_TOKEN input
        id: action
        continue-on-error: true
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config_path: '.github/labeler.yml'

      - name: Assert action ran (token input accepted)
        run: |
          # The action may exit non-zero under workflow_dispatch (no PR/issue to label),
          # but the important thing is that it accepted the GITHUB_TOKEN input and ran.
          # We verify the step was reached (not skipped) and the outcome is known.
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with GITHUB_TOKEN input (outcome=$OUTCOME)"
