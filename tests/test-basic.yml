name: Test basic labeler action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke labeler action (expect failure without real token)
        id: action
        uses: .
        with:
          GITHUB_TOKEN: fake-token-for-testing
        continue-on-error: true

      - name: Assert action was invoked
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail (not be skipped)
          # Without a real GitHub token and real repo context, the Docker container
          # will attempt to call the GitHub API and fail — that is expected behavior.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
