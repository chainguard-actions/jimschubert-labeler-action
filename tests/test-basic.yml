name: Test basic usage with default config path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          comment: |
            Thanks for opening this!
          labels:
            'bug':
              - '\bbug[s]?\b'
            'enhancement':
              - '\benhancement\b'
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run labeler action
        id: labeler
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (workflow_dispatch is not a labeled event, expect graceful exit or skip)
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (skip) or fail (unsupported event) — both are acceptable
          # What matters is it doesn't crash with a config/token error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
