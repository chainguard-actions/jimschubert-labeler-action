name: Test custom config path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom config path pointing to fixture
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config_path: tests/fixtures/labeler.yml
        continue-on-error: true

      - name: Assert action ran with custom config path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should start and attempt to process the event using the
          # custom config path. It may succeed or fail depending on the event
          # type (workflow_dispatch, id=0), but it must NOT be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom config path, outcome '$OUTCOME'"
