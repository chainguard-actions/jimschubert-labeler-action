name: Test custom config path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom labeler config at non-default path
        run: |
          mkdir -p .github/custom
          cat > .github/custom/my-labeler.yml << 'EOF'
          comment: |
            Custom labeler config loaded!
          labels:
            'question':
              - '\bquestion\b'
            'help wanted':
              - '\bhelp\b'
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run labeler action with custom config path
        id: labeler
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config_path: .github/custom/my-labeler.yml

      - name: Assert action ran with custom config (not a config-not-found error)
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (skip) or fail (unsupported event) — both are acceptable
          # What matters is it doesn't crash with a config-not-found error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited with custom config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
