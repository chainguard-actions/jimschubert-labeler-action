name: Test labeler action with custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a labeler config at a custom path
      - name: Create custom labeler config
        run: |
          mkdir -p .github/custom
          cat > .github/custom/my-labeler.yml << 'EOF'
          labels:
            - label: "enhancement"
              matcher:
                title: ".*feature.*"
            - label: "documentation"
              matcher:
                title: ".*docs.*"
          EOF

      # Invoke the action with a custom config_path.
      # The Docker image will attempt to call the GitHub API with a fake token,
      # so we expect it to fail — but we verify it was invoked correctly.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
        with:
          GITHUB_TOKEN: fake-token-for-testing
          config_path: .github/custom/my-labeler.yml

      - name: Assert action was invoked with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (not be skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with custom config path (outcome: $OUTCOME)"
