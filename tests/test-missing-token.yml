name: Test missing GITHUB_TOKEN fails with error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default labeler config
        run: |
          mkdir -p .github
          cat > .github/labeler.yml << 'EOF'
          comment: |
            Thanks for opening this!
          labels:
            'bug':
              - '\bbug[s]?\b'
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run labeler action without GITHUB_TOKEN
        id: labeler
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.labeler.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail when GITHUB_TOKEN is not provided
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed without GITHUB_TOKEN"
          else
            echo "FAIL: expected failure without GITHUB_TOKEN but got: $OUTCOME"
            exit 1
          fi
