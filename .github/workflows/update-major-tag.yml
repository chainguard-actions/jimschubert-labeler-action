# Update Major Version Tag: Automatically updates the major version tag (e.g., v1)
# to point to the latest patch release (e.g., v1.0.2) when a release is published.
# This allows users to reference @v1 and always get the latest v1.x.x version.
# Can also be triggered manually to force-update a major tag to a specific version.

name: Update Major Version Tag
run-name: Promote ${{ github.event.inputs.tag }} to Major Version Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update major version to (e.g., v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # PAT is required to push tags when there are any workflow modifications in that tag.
          token: ${{ secrets.PAT }}

      - name: Extract major version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Use input tag for manual trigger, or extract from GITHUB_REF for release event
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # Validate tag is not empty
          if [ -z "$TAG" ]; then
            echo "::error::Tag is empty. Please provide a valid tag."
            exit 1
          fi
          
          # Validate tag exists
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist."
            exit 1
          fi
          
          # Extract major version (v1 from v1.0.1, v1.2.3, etc.)
          MAJOR=$(echo "$TAG" | grep -oE '^v[0-9]+')
          
          # Validate major version was extracted
          if [ -z "$MAJOR" ]; then
            echo "::error::Could not extract major version from '$TAG'. Expected format: v1.0.0"
            exit 1
          fi
          
          safe_tag=$(printf '%s' "$TAG" | tr -d '\n\r')
          safe_major=$(printf '%s' "$MAJOR" | tr -d '\n\r')
          echo "tag=$safe_tag" >> "$GITHUB_OUTPUT"
          echo "major=$safe_major" >> "$GITHUB_OUTPUT"
          echo "Updating $safe_major to point to $safe_tag"

      - name: Update major version tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" "$TAG" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force
